# =============================================================================
# BTT Eddy USB
# =============================================================================

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443403108EE11C-if00
restart_method: command


[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100


[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 2.5

i2c_mcu: eddy
i2c_bus: i2c0f

x_offset: 27.5
y_offset: -30


[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2


# =============================================================================
# Bed Mesh
# =============================================================================

[bed_mesh]
horizontal_move_z: 2
speed: 200

mesh_min: 27.5, 10
mesh_max: 275, 270

probe_count: 12, 12
algorithm: bicubic

# scan_overshoot: 8


# =============================================================================
# Z Homing
# =============================================================================

[safe_z_home]
home_xy_position: 122.5, 180
z_hop: 5
z_hop_speed: 25
speed: 200


# Required when using Eddy as the Z homing probe.
[force_move]
enable_force_move: True


# =============================================================================
# Homing Macros
# =============================================================================

[gcode_macro G28]
rename_existing: G28.1
gcode:
    G28.1 {rawparams}

    {% if not rawparams or (rawparams and 'Z' in rawparams) %}
        PROBE
        SET_Z_FROM_PROBE
    {% endif %}


[gcode_macro SET_Z_FROM_PROBE]
gcode:
    SET_GCODE_OFFSET Z=0
    G90
    G1 Z5


# =============================================================================
# Eddy Calibration
# =============================================================================

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
    BED_MESH_CLEAR

    G28 X Y
    G90

    G1 X{printer.toolhead.axis_maximum.x / 2} \
       Y{printer.toolhead.axis_maximum.y / 2} \
       F6000

    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z - 1}
    {% endif %}

    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}


# =============================================================================
# Rapid Bed Mesh
# =============================================================================

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    BTT_BED_MESH_CALIBRATE METHOD=rapid_scan